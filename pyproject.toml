[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-clean"
version = "0.1.0"
description = "Reproducible offline imputation benchmarks for ocean buoy observations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scikit-learn>=1.3,<2"]

[project.scripts]
ocean-clean = "ocean_clean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
